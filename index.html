<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Temptations Cat Compliment Button</title>
  <meta name="description" content="Tap the button and your cat tells you what it really thinks of you.">
  <meta name="theme-color" content="#FFD21F">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script type="module" src="scene.js"></script>
</head>
<body>

  <nav class="navbar" aria-label="Menu">
    <button class="nav-item" id="howBtn" type="button" aria-haspopup="dialog">
      <span class="q" aria-hidden="true">?</span>
      <span id="howLabel">How it works</span>
    </button>
    <span class="nav-sep" aria-hidden="true"></span>
    <button class="nav-item switch" id="cc" type="button" role="switch" aria-checked="true" aria-label="Subtitles">
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      <span class="long" id="ccLabel" aria-hidden="true">Subtitles</span>
      <span class="short" aria-hidden="true">CC</span>
    </button>
    <span class="nav-sep" aria-hidden="true"></span>
    <div class="lang">
      <button class="nav-item lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu" aria-label="Language: English">
        <span class="flagbox" id="langFlag"><svg viewBox="0 0 60 30" aria-hidden="true"><path d="M0,0 h60 v30 h-60 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></span>
        <svg class="chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1.5 1.5 6 6l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul class="lang-menu" id="langMenu" role="menu" aria-label="Language" hidden>
        <li role="none">
          <button class="lang-opt" type="button" role="menuitemradio" aria-checked="true" data-lang="en" lang="en">
            <span class="flagbox"><svg viewBox="0 0 60 30" aria-hidden="true"><path d="M0,0 h60 v30 h-60 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></span><span class="lang-name">English</span><span class="tick" aria-hidden="true">&#10003;</span>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="menuitemradio" aria-checked="false" data-lang="es" lang="es">
            <span class="flagbox"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#AA151B"/><rect y="7.5" width="60" height="15" fill="#F1BF00"/></svg></span><span class="lang-name">Español</span><span class="tick" aria-hidden="true">&#10003;</span>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="menuitemradio" aria-checked="false" data-lang="it" lang="it">
            <span class="flagbox"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="20" height="30" fill="#009246"/><rect x="20" width="20" height="30" fill="#F1F2F1"/><rect x="40" width="20" height="30" fill="#CE2B37"/></svg></span><span class="lang-name">Italiano</span><span class="tick" aria-hidden="true">&#10003;</span>
          </button>
        </li>
        <li role="none">
          <button class="lang-opt" type="button" role="menuitemradio" aria-checked="false" data-lang="fr" lang="fr">
            <span class="flagbox"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="20" height="30" fill="#002654"/><rect x="20" width="20" height="30" fill="#F1F2F1"/><rect x="40" width="20" height="30" fill="#CE1126"/></svg></span><span class="lang-name">Français</span><span class="tick" aria-hidden="true">&#10003;</span>
          </button>
        </li>
      </ul>
    </div>
    <span class="nav-sep" aria-hidden="true"></span>
    <div class="settings">
      <button class="nav-item settings-btn" id="setBtn" type="button" aria-expanded="false" aria-controls="setPanel" aria-label="Settings" title="Settings">
        <svg class="cog" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1L14.5 2.8a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4L9.3 5.3a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.7 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.5c0 .2.2.4.5.4h3.8c.2 0 .4-.2.5-.4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.6ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
      <div class="set-panel" id="setPanel" role="group" aria-labelledby="setTitle" hidden>
        <p class="set-title" id="setTitle">Settings</p>
        <label class="set-label" for="view" id="viewLabel">View angle</label>
        <div class="view">
          <span class="view-end" id="viewTop" aria-hidden="true">Top</span>
          <input type="range" id="view" min="0" max="90" step="1" value="45">
          <span class="view-end" aria-hidden="true">90°</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="bubble-wrap" id="bubbleWrap" aria-hidden="true">
    <div class="bubble idle" id="bubble">
      <span id="line"></span>
    </div>
  </div>
  <!-- what the cat said, for screen readers, whether subtitles are on or off -->
  <p class="sr-only" id="live" aria-live="polite"></p>

  <div class="fit" id="fit">
    <div class="stage" id="stage">
      <span class="abs ground"></span>
      <span class="abs base-side"></span>
      <span class="abs gloss"></span>
      <span class="abs gloss two"></span>
      <span class="abs base-top"></span>
      <span class="abs seat"></span>
      <span class="abs cap-side"></span>
      <span class="abs cap-top">
        <svg viewBox="0 0 240 240" preserveAspectRatio="none" aria-hidden="true">
          <!-- the supplied logo, laid flat on the cap's round top; the svg stretches
               with the ellipse, so the logo foreshortens with the viewing angle -->
          <image x="25" y="69" width="190" height="102" href="assets/temptations-logo.png"/>
        </svg>
      </span>
      <button class="press" id="press" aria-label="Press for a compliment from your cat"></button>
    </div>
  </div>

  <div class="hint">
    <span id="hintMain">Tap for a compliment</span>
    <small id="hintSmall">Sound up.</small>
  </div>

  <dialog class="how" id="how" aria-labelledby="howTitle">
    <div class="how-inner">
      <button class="how-close" id="howClose" type="button" aria-label="Close">&#215;</button>
      <h2 id="howTitle">How it works</h2>
      <ol class="steps" id="howSteps"></ol>
      <p class="note" id="howNote"></p>
      <h2 id="treatTitle">How to treat your cat with Temptations</h2>
      <ul class="treats" id="treatList"></ul>
    </div>
  </dialog>
</body>
</html>
