<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Temptations Cat Compliment Button</title>
  <meta name="description" content="Tap the button and your cat tells you what it really thinks of you.">
  <meta name="theme-color" content="#FFD21F">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <header class="topbar">
    <button class="pill" id="howBtn" type="button" aria-haspopup="dialog">
      <span class="q" aria-hidden="true">?</span>
      <span id="howLabel">How it works</span>
    </button>
    <button class="pill switch" id="cc" type="button" role="switch" aria-checked="true">
      <span class="track" aria-hidden="true"><span class="thumb"></span></span>
      <span id="ccLabel">Subtitles</span>
    </button>
  </header>

  <div class="bubble-wrap" id="bubbleWrap" aria-hidden="true">
    <div class="bubble idle" id="bubble">
      <span id="line"></span>
    </div>
  </div>
  <!-- what the cat said, for screen readers, whether subtitles are on or off -->
  <p class="sr-only" id="live" aria-live="polite"></p>

  <div class="fit" id="fit">
    <div class="stage" id="stage">
      <span class="abs ground"></span>
      <span class="abs base-side"></span>
      <span class="abs gloss"></span>
      <span class="abs gloss two"></span>
      <span class="abs base-top"></span>
      <span class="abs seat"></span>
      <span class="abs cap-side"></span>
      <span class="abs cap-top">
        <svg viewBox="0 0 240 100" aria-hidden="true">
          <!-- the supplied Temptations logo, squashed vertically to sit flat on the tilted cap -->
          <image x="20" y="14" width="200" height="72" preserveAspectRatio="none" href="assets/temptations-logo.png"/>
        </svg>
      </span>
      <button class="press" id="press" aria-label="Press for a compliment from your cat"></button>
    </div>
  </div>

  <div class="hint">
    <span id="hintMain">Tap for a compliment*</span>
    <small id="hintSmall">*compliment not guaranteed. Sound up.</small>
  </div>

  <div class="langs" id="langs" role="group" aria-label="Language">
    <button class="flag" type="button" data-lang="en" aria-pressed="true" aria-label="English" title="English">
      <svg viewBox="0 0 60 30" aria-hidden="true">
        <clipPath id="ukClip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
        <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
        <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
        <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukClip)" stroke="#C8102E" stroke-width="4"/>
        <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
        <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
      </svg>
    </button>
    <button class="flag" type="button" data-lang="es" aria-pressed="false" aria-label="Español" title="Español">
      <svg viewBox="0 0 60 30" aria-hidden="true">
        <rect width="60" height="30" fill="#AA151B"/>
        <rect y="7.5" width="60" height="15" fill="#F1BF00"/>
      </svg>
    </button>
    <button class="flag" type="button" data-lang="it" aria-pressed="false" aria-label="Italiano" title="Italiano">
      <svg viewBox="0 0 60 30" aria-hidden="true">
        <rect width="20" height="30" fill="#009246"/>
        <rect x="20" width="20" height="30" fill="#F1F2F1"/>
        <rect x="40" width="20" height="30" fill="#CE2B37"/>
      </svg>
    </button>
    <button class="flag" type="button" data-lang="fr" aria-pressed="false" aria-label="Français" title="Français">
      <svg viewBox="0 0 60 30" aria-hidden="true">
        <rect width="20" height="30" fill="#002654"/>
        <rect x="20" width="20" height="30" fill="#F1F2F1"/>
        <rect x="40" width="20" height="30" fill="#CE1126"/>
      </svg>
    </button>
  </div>

  <dialog class="how" id="how" aria-labelledby="howTitle">
    <div class="how-inner">
      <button class="how-close" id="howClose" type="button" aria-label="Close">&#215;</button>
      <h2 id="howTitle">How it works</h2>
      <ol class="steps" id="howSteps"></ol>
      <p class="note" id="howNote"></p>
      <h2 id="treatTitle">How to treat your cat with Temptations</h2>
      <ul class="treats" id="treatList"></ul>
    </div>
  </dialog>
</body>
</html>
